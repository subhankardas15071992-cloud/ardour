name: Build Ardour Installers

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build'
        required: false
        default: 'master'
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:
    branches: [ master ]

jobs:
  windows-x86_64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git base-devel mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gtk2 mingw-w64-x86_64-gtkmm2
            mingw-w64-x86_64-glibmm mingw-w64-x86_64-libsigc++
            mingw-w64-x86_64-pangomm mingw-w64-x86_64-atkmm
            mingw-w64-x86_64-libsndfile mingw-w64-x86_64-libarchive
            mingw-w64-x86_64-curl mingw-w64-x86_64-taglib
            mingw-w64-x86_64-vamp-plugin-sdk mingw-w64-x86_64-rubberband
            mingw-w64-x86_64-aubio mingw-w64-x86_64-fftw
            mingw-w64-x86_64-portaudio mingw-w64-x86_64-lilv
            mingw-w64-x86_64-serd mingw-w64-x86_64-sord
            mingw-w64-x86_64-sratom mingw-w64-x86_64-lrdf
            mingw-w64-x86_64-boost mingw-w64-x86_64-liblo
            mingw-w64-x86_64-drmingw nsis
      - name: Configure & Build
        shell: msys2 {0}
        run: |
          ./waf configure --dist-target=mingw --prefix=/mingw64 --libdir=/mingw64/lib --with-backends=portaudio,dummy --no-dr-mingw
          ./waf build
          ./waf install --destdir=staging
      - name: Package Installer
        shell: msys2 {0}
        run: |
          # Copy dependencies and resources into staging for standalone app
          cp -r /mingw64/bin/*.dll staging/bin/ || true
          cp -r /mingw64/etc/gdk-pixbuf-2.0/* staging/etc/gdk-pixbuf-2.0/ || true
          cp -r /mingw64/share/fonts/* staging/share/fonts/ || true
          cp -r /mingw64/share/icons/* staging/share/icons/ || true
          
          VERSION=$(git describe --tags HEAD)
          MAKENSIS ci/windows/ardour.nsi \
            -DVERSION="${VERSION}" \
            -DSRCDIR="staging" \
            -DOUTFILE="Ardour-${VERSION}-windows-x86_64-installer.exe" \
            -DPRODUCT_NAME="Ardour"
      - uses: actions/upload-artifact@v4
        with:
          name: Ardour-windows-x86_64-installer
          path: Ardour-*-windows-x86_64-installer.exe

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Dependencies
        run: |
          brew install gtk+ gtkmm@2 glibmm libsigc++ pangomm atkmm libsndfile libarchive curl taglib vamp-plugin-sdk rubberband aubio fftw portaudio lilv serd sord sratom lrdf boost liblo create-dmg
      - name: Configure & Build
        run: |
          export PKG_CONFIG_PATH="/opt/homebrew/opt/gtk+/lib/pkgconfig:/opt/homebrew/opt/gtkmm@2/lib/pkgconfig:$PKG_CONFIG_PATH"
          ./waf configure --with-backends=coreaudio,dummy
          ./waf build
          ./waf install --destdir=staging
      - name: Create DMG
        run: |
          chmod +x ci/macos/build_dmg.sh
          ./ci/macos/build_dmg.sh staging "Ardour-$(git describe --tags HEAD)-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Ardour-macos-arm64-dmg
          path: Ardour-*-macos-arm64.dmg

  macos-x86_64:
    runs-on: macOS-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Dependencies
        run: |
          brew install gtk+ gtkmm@2 glibmm libsigc++ pangomm atkmm libsndfile libarchive curl taglib vamp-plugin-sdk rubberband aubio fftw portaudio lilv serd sord sratom lrdf boost liblo create-dmg
      - name: Configure & Build
        run: |
          export PKG_CONFIG_PATH="/usr/local/opt/gtk+/lib/pkgconfig:/usr/local/opt/gtkmm@2/lib/pkgconfig:$PKG_CONFIG_PATH"
          ./waf configure --with-backends=coreaudio,dummy
          ./waf build
          ./waf install --destdir=staging
      - name: Create DMG
        run: |
          chmod +x ci/macos/build_dmg.sh
          ./ci/macos/build_dmg.sh staging "Ardour-$(git describe --tags HEAD)-macos-x86_64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Ardour-macos-x86_64-dmg
          path: Ardour-*-macos-x86_64.dmg

  release:
    needs: [windows-x86_64, macos-arm64, macos-x86_64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Ardour-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *.exe
            *.dmg
