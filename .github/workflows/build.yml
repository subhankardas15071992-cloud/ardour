name: Build Ardour for Windows and macOS

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ARDOUR_VERSION: 9.8
  BUILD_TYPE: Release

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Windows x86_64 — native build on windows-latest using MSYS2 + mingw-w64
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Ardour source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full clone required for `git describe` versioning

      - name: Install MSYS2
        run: |
          if (-not (Test-Path "C:\msys64\usr\bin\bash.exe")) {
            Invoke-WebRequest -Uri "https://github.com/msys2/msys2-installer/releases/download/2024-07-25/msys2-base-x86_64-20240725.sfx.exe" -OutFile "$env:TEMP\msys2.exe"
            Start-Process -FilePath "$env:TEMP\msys2.exe" -ArgumentList "-y -ai -oC:\msys64" -Wait
          }

      - name: Install mingw-w64 toolchain and available dependencies
        run: |
          # Note: Many Ardour dependencies (glibmm, gtk2, gtkmm, libcurl, vamp-plugin-sdk,
          # rubberband, cairomm, pangomm, lv2, serd, sord, sratom, lilv, libusb, yasm)
          # are NOT available as prebuilt MSYS2 packages. They must be built from source
          # into a win-stack-w64 dependency stack (see tools/x-win/compile.sh).
          # Here we install only what MSYS2 provides; the rest must come from a custom stack.
          $pkgs = @(
            'mingw-w64-x86_64-toolchain',
            'mingw-w64-x86_64-cmake',
            'mingw-w64-x86_64-ninja',
            'mingw-w64-x86_64-meson',
            'mingw-w64-x86_64-pkgconf',
            'mingw-w64-x86_64-boost',
            'mingw-w64-x86_64-gettext',
            'mingw-w64-x86_64-glib2',
            'mingw-w64-x86_64-libsndfile',
            'mingw-w64-x86_64-libarchive',
            'mingw-w64-x86_64-taglib',
            'mingw-w64-x86_64-cppunit',
            'mingw-w64-x86_64-jack2',
            'mingw-w64-x86_64-fftw',
            'mingw-w64-x86_64-flac',
            'mingw-w64-x86_64-libogg',
            'mingw-w64-x86_64-fontconfig',
            'mingw-w64-x86_64-cairo',
            'mingw-w64-x86_64-pango',
            'mingw-w64-x86_64-libpng',
            'mingw-w64-x86_64-libxml2',
            'mingw-w64-x86_64-zlib',
            'mingw-w64-x86_64-freetype',
            'mingw-w64-x86_64-harfbuzz',
            'mingw-w64-x86_64-pixman',
            'mingw-w64-x86_64-gdk-pixbuf2',
            'mingw-w64-x86_64-atk',
            'mingw-w64-x86_64-p11-kit',
            'mingw-w64-x86_64-libffi',
            'mingw-w64-x86_64-expat',
            'mingw-w64-x86_64-bzip2',
            'mingw-w64-x86_64-xz',
            'mingw-w64-x86_64-zstd',
            'mingw-w64-x86_64-libiconv',
            'git', 'python', 'make', 'patch', 'rsync', 'wget', 'curl'
          )
          & "C:\msys64\usr\bin\bash.exe" -lc "pacman -Sy --noconfirm --needed pacman-mirrors msys2-runtime"
          foreach ($pkg in $pkgs) {
            Write-Host "Installing $pkg..."
            & "C:\msys64\usr\bin\bash.exe" -lc "pacman -S --noconfirm --needed $pkg" || Write-Host "SKIP: $pkg not available"
          }

      - name: Verify mingw toolchain
        run: |
          & "C:\msys64\usr\bin\bash.exe" -lc "x86_64-w64-mingw32-gcc --version | head -1"
          & "C:\msys64\usr\bin\bash.exe" -lc "pkg-config --version"

      - name: Configure Ardour (mingw)
        run: |
          & "C:\msys64\usr\bin\bash.exe" -lc "export PKG_CONFIG_PATH='/mingw64/lib/pkgconfig:/mingw64/share/pkgconfig'; ./waf configure --dist-target=mingw --ptformat --with-backends=jack,portaudio,dummy --optimize --cxx17 --prefix=/mingw64 --libdir=/mingw64/lib --no-phone-home --no-lrdf --no-nls 2>&1 | tee configure.log"

      - name: Build Ardour (mingw)
        run: |
          & "C:\msys64\usr\bin\bash.exe" -lc "./waf -j$(nproc) 2>&1 | tee build.log"

      - name: Build translations
        run: |
          & "C:\msys64\usr\bin\bash.exe" -lc "./waf i18n 2>&1 | tee i18n.log" || true

      - name: Collect build artifacts
        run: |
          & "C:\msys64\usr\bin\bash.exe" -lc "mkdir -p ardour-win64-build; cp -r build/gtk2_ardour/ardour*.exe ardour-win64-build/ 2>/dev/null || true; find build -name '*.exe' -o -name '*.dll' -o -name '*.pdb' 2>/dev/null | while read f; do cp --parents `"$f`" ardour-win64-build/ 2>/dev/null || true; done; ls -la ardour-win64-build/"

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ardour-windows-x86_64
          path: |
            ardour-win64-build/
          retention-days: 7

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # macOS ARM64 — native build on macOS-latest (Apple Silicon)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  macos-arm64:
    name: macOS ARM64 (Apple Silicon)
    runs-on: macOS-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Ardour source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Xcode command line tools
        run: |
          xcode-select --install 2>/dev/null || true
          sudo xcodebuild -license accept 2>/dev/null || true

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install \
            glib \
            glibmm \
            libsndfile \
            libcurl \
            libarchive \
            liblo \
            taglib \
            vamp-plugin-sdk \
            rubberband \
            cppunit \
            jack \
            fftw \
            flac \
            libogg \
            fontconfig \
            cairo \
            cairomm \
            pango \
            pangomm \
            libpng \
            libxml2 \
            lv2 \
            serd \
            sord \
            sratom \
            lilv \
            soundtouch \
            libsamplerate \
            fluidsynth \
            libwebsockets \
            libusb \
            pkg-config \
            yasm \
            boost \
            gettext \
            intltool \
            autoconf \
            automake \
            libtool \
            python@3.12 \
            cmake \
            ninja \
            meson

      - name: Verify build tools
        run: |
          clang --version | head -1
          clang++ --version | head -1
          pkg-config --version
          python3 --version

      - name: Configure Ardour (macOS ARM64)
        env:
          LC_CTYPE: C
          ARM_NEON_SUPPORT: 1
          CPATH: /opt/homebrew/include:/usr/local/include
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: |
          set -o pipefail
          export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH"
          ./waf configure \
            --arm64 \
            --ptformat \
            --libjack=weak \
            --optimize \
            --jobs=$(sysctl -n hw.logicalcpu) \
            --no-carbon \
            --no-phone-home \
            --no-lrdf \
            --no-nls \
            --prefix=/opt/Ardour \
            2>&1 | tee configure.log

      - name: Build Ardour (macOS ARM64)
        env:
          LC_CTYPE: C
          ARM_NEON_SUPPORT: 1
          CPATH: /opt/homebrew/include:/usr/local/include
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: |
          ./waf -j$(sysctl -n hw.logicalcpu) 2>&1 | tee build.log

      - name: Build translations
        env:
          LC_CTYPE: C
        run: |
          ./waf i18n 2>&1 | tee i18n.log || true

      - name: Collect macOS ARM64 build artifacts
        run: |
          mkdir -p ardour-macos-arm64-build
          find build -name "ardour*" -type f 2>/dev/null | while read f; do
            cp --parents "$f" ardour-macos-arm64-build/ 2>/dev/null || true
          done
          find build -name "*.dylib" 2>/dev/null | while read f; do
            cp --parents "$f" ardour-macos-arm64-build/ 2>/dev/null || true
          done
          ls -la ardour-macos-arm64-build/

      - name: Upload macOS ARM64 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ardour-macos-arm64
          path: |
            ardour-macos-arm64-build/
          retention-days: 7

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # macOS x86_64 — native build on macOS-15-intel (Intel Mac)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  macos-x86_64:
    name: macOS x86_64 (Intel)
    runs-on: macOS-15-intel
    timeout-minutes: 360

    steps:
      - name: Checkout Ardour source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Xcode command line tools
        run: |
          xcode-select --install 2>/dev/null || true
          sudo xcodebuild -license accept 2>/dev/null || true

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install \
            glib \
            glibmm \
            libsndfile \
            libcurl \
            libarchive \
            liblo \
            taglib \
            vamp-plugin-sdk \
            rubberband \
            cppunit \
            jack \
            fftw \
            flac \
            libogg \
            fontconfig \
            cairo \
            cairomm \
            pango \
            pangomm \
            libpng \
            libxml2 \
            lv2 \
            serd \
            sord \
            sratom \
            lilv \
            soundtouch \
            libsamplerate \
            fluidsynth \
            libwebsockets \
            libusb \
            pkg-config \
            yasm \
            boost \
            gettext \
            intltool \
            autoconf \
            automake \
            libtool \
            python@3.12 \
            cmake \
            ninja \
            meson

      - name: Verify build tools
        run: |
          clang --version | head -1
          clang++ --version | head -1
          pkg-config --version
          python3 --version

      - name: Configure Ardour (macOS x86_64)
        env:
          LC_CTYPE: C
          CPATH: /opt/homebrew/include:/usr/local/include
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: |
          set -o pipefail
          export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH"
          ./waf configure \
            --ptformat \
            --libjack=weak \
            --optimize \
            --jobs=$(sysctl -n hw.logicalcpu) \
            --no-carbon \
            --no-phone-home \
            --no-lrdf \
            --no-nls \
            --prefix=/opt/Ardour \
            2>&1 | tee configure.log

      - name: Build Ardour (macOS x86_64)
        env:
          LC_CTYPE: C
          CPATH: /opt/homebrew/include:/usr/local/include
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: |
          ./waf -j$(sysctl -n hw.logicalcpu) 2>&1 | tee build.log

      - name: Build translations
        env:
          LC_CTYPE: C
        run: |
          ./waf i18n 2>&1 | tee i18n.log || true

      - name: Collect macOS x86_64 build artifacts
        run: |
          mkdir -p ardour-macos-x86_64-build
          find build -name "ardour*" -type f 2>/dev/null | while read f; do
            cp --parents "$f" ardour-macos-x86_64-build/ 2>/dev/null || true
          done
          find build -name "*.dylib" 2>/dev/null | while read f; do
            cp --parents "$f" ardour-macos-x86_64-build/ 2>/dev/null || true
          done
          ls -la ardour-macos-x86_64-build/

      - name: Upload macOS x86_64 build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ardour-macos-x86_64
          path: |
            ardour-macos-x86_64-build/
          retention-days: 7
